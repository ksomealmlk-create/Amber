name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name amber_game --org com.amber.game .
          rm -rf test
      - name: App name, icon
        run: |
          sed -i 's/android:label="[^"]*"/android:label="الجمرة التائهة"/' android/app/src/main/AndroidManifest.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp tools/icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Amber.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Amber-apk
          path: Amber.apk
